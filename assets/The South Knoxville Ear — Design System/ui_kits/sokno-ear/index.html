<html lang="en">
<head>

<link rel="stylesheet" href="../../styles.css">
<style>

      { id: "top", label: "Home" },
      { id: "events", label: "Events" },
      { id: "rumors", label: "Rumors" },
      { id: "old-sevier", label: "Old Sevier" },
      { id: "waterfront", label: "South Waterfront" },
      { id: "wilderness", label: "Urban Wilderness" },
      { id: "listen", label: "Listen" },

    function App() {
      return (
        <React.Fragment>
          <Masthead assets="../../assets" sections={sections} />
          <WeeklyPaper />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
