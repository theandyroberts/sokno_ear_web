<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .nav { font-family: var(--font-label); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-black); }
  .nav.active { color: var(--rust); }
  .rubric { font-family: var(--font-label); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rust); }
  .meta { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faded); }
</style>
</head>
<body>
  <div class="row">
    <span class="nav active">Home</span>
    <span class="nav">Events</span>
    <span class="nav">Rumors</span>
    <span class="nav">Old Sevier</span>
    <span class="nav">Listen</span>
  </div>
  <div class="row">
    <span class="rubric">★ Weekend Audio Briefing ★</span>
    <span class="rubric">What We're Hearing</span>
  </div>
  <div class="meta">Oswald · 600 · uppercase · tracking 0.08–0.14em</div>
</body>
</html>
