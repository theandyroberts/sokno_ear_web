<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base — hand-set print rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; font-family: var(--font-label); }
  .bar { background: var(--rust); border: 1px solid var(--ink-black); margin: 0 auto 8px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-black); }
  .px { font-size: 10px; color: var(--ink-faded); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="lbl">1</div><div class="px">4px</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="lbl">2</div><div class="px">8px</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="lbl">3</div><div class="px">12px</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="lbl">4</div><div class="px">16px</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="lbl">5</div><div class="px">24px</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="lbl">6</div><div class="px">32px</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="lbl">7</div><div class="px">48px</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="lbl">8</div><div class="px">64px</div></div>
  </div>
</body>
</html>
