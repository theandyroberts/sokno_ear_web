<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; }
  .hero { font-family: var(--font-display); font-size: 52px; line-height: 0.98; letter-spacing: -0.01em; color: var(--ink-black); margin: 0; }
  .sub { font-family: var(--font-display); font-size: 26px; color: var(--rust); margin: 6px 0 0; }
  .meta { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faded); margin-top: 16px; }
</style>
</head>
<body>
  <h1 class="hero">PRIDE DAY<br>DOUBLE FEATURE</h1>
  <div class="sub">6 PM Afterglow</div>
  <div class="meta">Bevan · single weight · uppercase · tracking −0.01em</div>
</body>
</html>
