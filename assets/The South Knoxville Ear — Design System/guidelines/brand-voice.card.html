<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; gap: 22px; align-items: center; }
  .art { flex: none; width: 150px; height: 150px; border: var(--border-ink) solid var(--ink-black); border-radius: var(--radius-sm); background: var(--paper-bright); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .art img { width: 100%; height: 100%; object-fit: cover; }
  .copy { flex: 1; }
  .tag { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--ink-black); margin: 0 0 10px; }
  .tag em { color: var(--rust); font-style: normal; }
  .voice { font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faded); line-height: 1.9; }
  .voice b { color: var(--green-bridge); }
</style>
</head>
<body>
  <div class="art"><img src="../assets/possum_street_art.png" alt="SoKno possum mascot with Sunsphere mic"></div>
  <div class="copy">
    <p class="tag">We report it.<br><em>You live it.</em><br>We hear things.</p>
    <div class="voice">Neighborly · Curious · <b>Lightly funny</b> · Locally fluent · Mildly nosy, never mean</div>
  </div>
</body>
</html>
