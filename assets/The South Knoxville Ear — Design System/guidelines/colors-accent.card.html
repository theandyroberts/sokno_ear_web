<!-- @dsCard group="Colors" viewport="700x150" name="Accents — Editorial Marks" subtitle="Teal & rust as accents; gold is rare and special" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 64px; border: var(--border-ink) solid var(--ink-black); border-radius: var(--radius-sm); }
  .meta { font-family: var(--font-label); margin-top: 8px; }
  .name { font-size: 12px; font-weight: 600; letter-spacing: var(--tracking-label-tight); text-transform: uppercase; color: var(--ink-black); }
  .hex { font-size: 12px; color: var(--ink-faded); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="meta"><div class="name">SoKno Teal</div><div class="hex">#7FAEA3</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-bridge)"></div><div class="meta"><div class="name">Bridge Green</div><div class="hex">#315D54</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rust)"></div><div class="meta"><div class="name">Rust Red</div><div class="hex">#A94A34</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rust-dark)"></div><div class="meta"><div class="name">Dark Rust</div><div class="hex">#743124</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="meta"><div class="name">Sunsphere Gold</div><div class="hex">#D8A725</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--eye-blue)"></div><div class="meta"><div class="name">Eye Blue</div><div class="hex">#7FB7D7</div></div></div>
  </div>
</body>
</html>
