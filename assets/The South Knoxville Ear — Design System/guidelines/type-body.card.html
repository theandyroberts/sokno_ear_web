<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; }
  .deck { font-family: var(--font-body); font-size: 19px; font-weight: 700; line-height: 1.3; color: var(--ink-black); margin: 0 0 10px; max-width: 60ch; }
  .body { font-family: var(--font-body); font-size: 17px; line-height: 1.6; color: var(--ink-black); margin: 0; max-width: 62ch; }
  .body em { color: var(--rust-dark); }
  .meta { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faded); margin-top: 16px; }
</style>
</head>
<body>
  <p class="deck">Your guide to South Knoxville Pride happenings on Sevier Avenue.</p>
  <p class="body">Celebrate with local music, vendors, and community energy, then an evening of joy that keeps the good vibes rolling long after sunset. We report it — <em>you live it</em>.</p>
  <div class="meta">PT Serif · 17px body / 19px deck · line-height 1.6</div>
</body>
</html>
